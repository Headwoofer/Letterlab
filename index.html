<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f0">
<title>Letterlab — spelling oefenen · versie 1.2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap');
:root{--bg:#f6f5f0;--surface:#fff;--ink:#22352f;--muted:#78837d;--green:#157665;--green2:#e8f4ef;--border:#e4e9e3;--red:#af584d;--yellow:#f9eac5;--shadow:0 12px 40px rgba(29,57,45,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,sans-serif;line-height:1.45}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #95c4b5;outline-offset:2px}
.shell{max-width:1140px;margin:auto;padding:22px 24px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:42px}.brand{display:flex;align-items:center;gap:10px;font:800 24px 'Outfit',sans-serif;letter-spacing:-1px;cursor:pointer}.brand-mark{width:37px;height:37px;border-radius:12px;background:var(--green);color:white;display:grid;place-items:center;font-size:22px}.top-actions{display:flex;gap:8px;align-items:center}.chip,.btn{border:1px solid var(--border);border-radius:12px;background:white;color:var(--ink);padding:10px 15px;font-weight:700;transition:.15s}.chip{font-size:13px}.chip.active{background:var(--ink);color:white;border-color:var(--ink)}.btn:hover,.chip:hover{transform:translateY(-1px)}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn.dark{background:var(--ink);color:white;border-color:var(--ink)}.btn.ghost{background:transparent}.btn.small{padding:8px 11px;font-size:13px}.btn.danger{color:#a33c34}.btn:disabled:hover{transform:none}.btn.big{font-size:16px;padding:14px 22px}.header{margin-bottom:24px}.eyebrow{color:var(--green);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:11px;margin:0 0 8px}h1,h2,h3,p{margin-top:0}h1,h2,h3{font-family:Outfit,system-ui;letter-spacing:-.045em}h1{font-size:clamp(36px,5vw,54px);line-height:1.06;margin-bottom:12px}h2{font-size:28px;margin-bottom:12px}h3{font-size:19px;margin-bottom:9px}p{color:#68766d}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.grid.two{grid-template-columns:repeat(2,1fr)}.card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:23px;box-shadow:var(--shadow)}.card.clickable{cursor:pointer;transition:.2s}.card.clickable:hover{border-color:#9abcb0;transform:translateY(-3px)}.card .icon{width:45px;height:45px;background:var(--green2);border-radius:13px;display:grid;place-items:center;font-size:24px;margin-bottom:18px}.muted{color:var(--muted)}.micro{font-size:12px}.stat{font:800 33px Outfit}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:15px}.pill{font-size:12px;font-weight:800;border-radius:100px;padding:6px 10px;background:#edf1ec;color:#67776e;display:inline-flex;align-items:center;gap:4px}.pill.good{background:var(--green2);color:var(--green)}.pill.warn{background:#fff1da;color:#8c6522}.field{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:800}input[type=text],input[type=password],textarea,select{background:#fff;border:1.5px solid #dce5de;border-radius:12px;padding:12px 13px;color:var(--ink);width:100%;min-width:0}textarea{resize:vertical;min-height:140px}input::placeholder,textarea::placeholder{color:#a0aaa3}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.bar{height:9px;background:#e9eeea;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .2s}.empty{text-align:center;padding:35px}.divider{height:1px;background:var(--border);margin:16px 0}.list-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:17px 0;border-bottom:1px solid var(--border)}.list-row:last-child{border:0}.list-row h3{margin:0 0 4px}.list-row p{margin:0;font-size:13px}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.word-tags{display:flex;flex-wrap:wrap;gap:7px}.word-tags span{background:#f0f4f0;border-radius:8px;padding:6px 9px;font-size:13px}.panel-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.notice{background:#fff9e9;padding:13px 16px;border:1px solid #f1e5c5;border-radius:12px;font-size:13px;color:#7b6433}.intro{max-width:680px}.welcome-illustration{font-size:62px}.learner-hero{display:grid;grid-template-columns:1.4fr .6fr;gap:20px;align-items:center;margin-bottom:25px}.exercise{max-width:760px;margin:0 auto;text-align:center}.exercise .card{padding:clamp(22px,5vw,45px)}.exercise-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;gap:10px}.word-display{font:500 clamp(38px,7vw,70px)/1.3 Outfit;letter-spacing:.005em;overflow-wrap:anywhere;margin:35px 0}.instruction{font:700 clamp(20px,3vw,28px) Outfit;margin:5px 0 9px}.listen{font-size:26px;min-width:63px;min-height:63px;border-radius:18px;background:var(--green2);border:0;color:var(--green)}.typing{font:500 clamp(25px,4vw,40px) Outfit!important;text-align:center;letter-spacing:.05em;max-width:530px;border:2px solid #c9d8ce!important;padding:16px!important;margin:15px auto}.typing.shake{animation:shake .23s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.hint{font-size:14px;color:var(--muted);min-height:24px}.helper{min-height:36px;margin-top:12px}.word-stage{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center}.progress-label{font-size:13px;color:var(--muted)}.result-number{font:800 72px Outfit;color:var(--green);letter-spacing:-.06em}.mini-result{padding:12px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px}.mini-result:last-child{border:none}.correct{color:var(--green)}.incorrect{color:var(--red)}.hidden{display:none!important}.footer{margin-top:35px;font-size:12px;color:#9ba59d;text-align:center}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:13px 20px;border-radius:13px;background:var(--ink);color:white;font-size:14px;font-weight:600;box-shadow:var(--shadow);z-index:30;max-width:90vw}.modal-cover{position:fixed;inset:0;background:#172c23aa;display:grid;place-items:center;padding:16px;z-index:20}.modal{background:var(--bg);width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:24px;padding:26px;box-shadow:0 30px 80px #09241950}.check-list{display:flex;flex-wrap:wrap;gap:8px}.check-list label{font-size:13px;padding:9px 11px;border-radius:10px;border:1px solid var(--border);background:white;cursor:pointer}.check-list label:has(input:checked){background:var(--green2);border-color:#a9cbbd}.check-list input{accent-color:var(--green)}.steps{display:flex;justify-content:center;gap:6px;margin:12px 0 8px}.steps i{height:6px;flex:1;max-width:70px;border-radius:10px;background:#e3e9e4}.steps i.on{background:var(--green)}.kbd{display:inline-block;padding:3px 7px;border-radius:5px;background:#eaf0ea;font-size:12px}a{color:var(--green)}@media(max-width:700px){.shell{padding:15px 15px 45px}.top{margin-bottom:28px;align-items:flex-start}.brand{font-size:20px}.brand-mark{width:33px;height:33px}.chip{padding:9px 10px;font-size:12px}.grid,.grid.two,.form-grid,.learner-hero{grid-template-columns:1fr}.card{padding:18px}.list-row{align-items:flex-start;flex-direction:column}.exercise-head{margin-bottom:15px}.word-stage{min-height:195px}.result-number{font-size:60px}.top-actions{gap:5px}.top-actions .chip{font-size:11px}.modal{padding:18px}}

/* Motiverend, maar rustig: geen flitsen, geluidseffecten of straf voor fouten */
.motivation{background:#edf7ef;border:1px solid #cde6d4;border-radius:15px;padding:14px 17px;margin:13px 0;color:#25553e;text-align:left}
.motivation strong{display:block;font-size:15px}.motivation small{display:block;margin-top:4px;color:#577465}
.stars{font-size:23px;letter-spacing:5px;margin:12px 0}.milestones{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.milestone{padding:6px 10px;background:#f2f4f1;color:#637168;border-radius:18px;font-size:12px;font-weight:800}
.milestone.earned{background:#e3f4e7;color:#176d45}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Rustige typografie en beeldwachtwoord */
.word-display.correct{font-weight:500}
.login-box{max-width:510px;margin:20px auto}.picture-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.picture{min-height:77px;border:2px solid #dce5de;border-radius:15px;background:white;font-size:32px;display:grid;place-items:center;cursor:pointer}.picture:focus-visible{outline:3px solid #95c4b5}.picture.chosen{background:var(--green2);border-color:var(--green)}.picture:disabled{opacity:.4}.pin-sequence{font-size:26px;letter-spacing:7px;min-height:42px;margin:12px 0}.auth-warning{margin-top:20px;font-size:12px;color:#6e6e67}
</style>
</head>
<body>
<div id="app"><main style="max-width:650px;margin:48px auto;padding:24px;font-family:system-ui;color:#22352f"><h1>Letterlab</h1><p>Deze applicatie heeft JavaScript nodig. Zie je alleen deze melding? Dan opent je apparaat het bestand als voorbeeldweergave in plaats van als website.</p><p>Upload <strong>index.html</strong> naar GitHub Pages en open de https-link in Safari.</p></main></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div><div id="modal-root"></div>
<script>
'use strict';
/* Letterlab: zelfstandig demonstratieprogramma. Alle gegevens staan in localStorage van deze browser. */
const KEY='letterlab_demo_v1';
const VOICE_KEY='letterlab_nl_voice_v2';
let voicePrefs={id:'auto',rate:0.9};try{voicePrefs={...voicePrefs,...JSON.parse(localStorage.getItem(VOICE_KEY)||'{}')}}catch(e){}
let currentUtterance=null,voiceList=[],pendingSpeech=null,voiceEndTimer=null;
const SAMPLE={version:1,students:[{id:'s_eden',name:'Eden'},{id:'s_donovan',name:'Donovan'},{id:'s_demo',name:'Proefleerling'}],lists:[{id:'l_start',name:'Lange en korte klanken',level:'Groep 5',words:['bomen','bommen','ramen','rammen','stenen','stappen','vissen','vazen'],assigned:['s_eden','s_donovan','s_demo']},{id:'l_easy',name:'Korte woorden',level:'Groep 3',words:['boom','vis','kat','roos','huis','fiets'],assigned:['s_demo']}],progress:{},results:[]};
const clone=x=>JSON.parse(JSON.stringify(x));
let db=load(),view='home',activeStudent=null,session=null,editingId=null,modalKind=null,saveTimer=null;
const PICTURES=['🐱','🐶','🦊','🐸','🐼','🐙','🦋','🐢','🚀','🌈','🍎','⭐'];
let auth=null,chosenPictures=[],picturePurpose=null;
function isTeacher(){return auth?.role==='teacher'}
function isStudent(){return auth?.role==='student' && auth.id===activeStudent}
function usernameValid(v){return /^[a-zA-Z0-9._-]{3,30}$/.test(v)}
function studentByUsername(u){return db.students.find(s=>s.username?.toLowerCase()===u.trim().toLowerCase())}
async function hashText(t){const raw=new TextEncoder().encode(t);const digest=await crypto.subtle.digest('SHA-256',raw);return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function logout(){auth=null;activeStudent=null;session=null;view='home';render()}
function accessAllowed(){if(!db.teacherAuth)return view==='setup';if(!auth)return view==='home'||view==='login-teacher'||view==='login-student';if(isTeacher())return !['student','practice','dictation','result'].includes(view);if(auth.role==='student')return ['student','practice','dictation','result'].includes(view);return false}
function pictureKeys(){return PICTURES.map((emoji,i)=>({emoji,i})).sort(()=>Math.random()-.5)}
function pictureSelector(containerId){const target=document.getElementById(containerId);if(!target)return;const order=pictureKeys();target.innerHTML=`<div class="picture-grid">${order.map(({emoji,i})=>`<button class="picture" type="button" data-index="${i}" aria-label="Plaatje ${i+1}" onclick="selectPicture(${i},'${containerId}')">${emoji}</button>`).join('')}</div><div class="pin-sequence" aria-live="polite" id="picture-pin">${'○ '.repeat(4)}</div><button type="button" class="btn small" onclick="chosenPictures=[];pictureSelector('${containerId}')">Opnieuw kiezen</button>`}
function selectPicture(i,containerId){if(chosenPictures.length>=4||chosenPictures.includes(i))return;chosenPictures.push(i);const dots=document.getElementById('picture-pin');if(dots)dots.textContent='● '.repeat(chosenPictures.length)+'○ '.repeat(4-chosenPictures.length);document.querySelectorAll('#'+containerId+' .picture').forEach(b=>{if(Number(b.dataset.index)===i)b.classList.add('chosen')});if(chosenPictures.length===4){if(picturePurpose==='studentLogin')studentPictureLogin();else if(picturePurpose==='studentEdit')savePictureCode()}}
function setupTeacher(){layout(`<section class="card login-box"><p class="eyebrow">Eerste keer</p><h1>Leerkrachtaccount instellen</h1><p>Maak een gebruikersnaam en wachtwoord. Bewaar deze zelf: in deze lokale proefversie is er geen online wachtwoordherstel.</p><form onsubmit="createTeacher(event)" class="stack"><label class="field">Gebruikersnaam<input id="teacher-user" required minlength="3" maxlength="30" autocomplete="username" placeholder="bijv. jufemma"></label><label class="field">Wachtwoord (minimaal 10 tekens)<input id="teacher-pass" type="password" required minlength="10" autocomplete="new-password"></label><label class="field">Herhaal wachtwoord<input id="teacher-pass2" type="password" required minlength="10" autocomplete="new-password"></label><button class="btn primary big" type="submit">Leerkrachtaccount maken</button></form><p class="auth-warning">Proefversie: gegevens en toegangscontrole staan lokaal op dit apparaat. Niet geschikt als beveiliging voor echte leerlinggegevens.</p></section>`)}
async function createTeacher(e){e.preventDefault();const u=document.getElementById('teacher-user').value.trim().toLowerCase(),pw=document.getElementById('teacher-pass').value,again=document.getElementById('teacher-pass2').value;if(!usernameValid(u))return toast('Gebruik 3–30 tekens: letters, cijfers, punt, streepje of underscore.');if(pw.length<10||pw!==again)return toast('Wachtwoorden komen niet overeen of zijn te kort.');if(!crypto?.subtle)return toast('Open Letterlab via een beveiligde HTTPS-website.');db.teacherAuth={username:u,hash:await hashText('letterlab-teacher:'+u+':'+pw)};save();auth={role:'teacher'};view='teacher';render()}
function studentLoginView(){chosenPictures=[];layout(`<section class="card login-box"><button class="btn ghost small" onclick="navigate('home')">← Terug</button><p class="eyebrow" style="margin-top:16px">Leerling</p><h1>Welkom terug!</h1><p>Typ je gebruikersnaam en kies daarna je vier plaatjes in de juiste volgorde.</p><label class="field">Gebruikersnaam<input id="student-user" type="text" maxlength="30" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Jouw gebruikersnaam"></label><div id="student-pictures"></div><p class="micro muted">Kies vier verschillende plaatjes. Ze staan elke keer op een andere plek.</p><p id="auth-error" role="alert" style="color:var(--red)"></p></section>`);picturePurpose='studentLogin';pictureSelector('student-pictures')}
async function studentPictureLogin(){const u=document.getElementById('student-user')?.value||'';const person=studentByUsername(u);const value=chosenPictures.join('-');if(!person||!person.pictureCode||person.pictureCode!==value){document.getElementById('auth-error').textContent='Gebruikersnaam of plaatjesvolgorde klopt niet. Probeer opnieuw.';chosenPictures=[];pictureSelector('student-pictures');return}auth={role:'student',id:person.id};activeStudent=person.id;chosenPictures=[];view='student';render()}
function teacherLoginView(){layout(`<section class="card login-box"><button class="btn ghost small" onclick="navigate('home')">← Terug</button><p class="eyebrow" style="margin-top:16px">Leerkracht</p><h1>Inloggen</h1><form class="stack" onsubmit="teacherLogin(event)"><label class="field">Gebruikersnaam<input id="login-user" required autocomplete="username"></label><label class="field">Wachtwoord<input id="login-pass" type="password" required autocomplete="current-password"></label><button class="btn primary big" type="submit">Inloggen</button></form></section>`)}
async function teacherLogin(e){e.preventDefault();const u=document.getElementById('login-user').value.trim().toLowerCase(),pw=document.getElementById('login-pass').value;if(u!==db.teacherAuth.username||await hashText('letterlab-teacher:'+u+':'+pw)!==db.teacherAuth.hash)return toast('Gebruikersnaam of wachtwoord is niet goed.');auth={role:'teacher'};view='teacher';render()}
function changeTeacherCredentials(){if(!isTeacher())return;const old=prompt('Huidig wachtwoord:');if(old===null)return;(async()=>{if(await hashText('letterlab-teacher:'+db.teacherAuth.username+':'+old)!==db.teacherAuth.hash)return toast('Huidig wachtwoord klopt niet.');let u=prompt('Nieuwe gebruikersnaam:',db.teacherAuth.username);if(u===null)return;u=u.trim().toLowerCase();if(!usernameValid(u))return toast('Gebruikersnaam moet 3–30 toegestane tekens bevatten.');let pw=prompt('Nieuw wachtwoord (minimaal 10 tekens):');if(pw===null)return;if(pw.length<10)return toast('Wachtwoord is te kort.');db.teacherAuth={username:u,hash:await hashText('letterlab-teacher:'+u+':'+pw)};save();toast('Leerkrachtaccount bijgewerkt')})()}
function editStudentAccount(i){if(!isTeacher())return;const st=findStudent(i);if(!st)return;let newUser=prompt('Gebruikersnaam van '+st.name+':',st.username||'');if(newUser===null)return;newUser=newUser.trim().toLowerCase();if(!usernameValid(newUser)||db.students.some(s=>s.id!==i&&s.username?.toLowerCase()===newUser))return toast('Ongeldige of al gebruikte gebruikersnaam.');st.username=newUser;save();beginPictureEdit(i)}
function beginPictureEdit(i){if(!isTeacher())return;const st=findStudent(i);if(!st)return;editingPictureStudent=i;chosenPictures=[];picturePurpose='studentEdit';document.getElementById('modal-root').innerHTML=`<div class="modal-cover"><div class="modal"><h2>Vier plaatjes voor ${esc(st.name)}</h2><p>Kies vier verschillende plaatjes in de volgorde die het kind straks moet invoeren.</p><div id="edit-pictures"></div><div class="row wrap" style="margin-top:15px"><button class="btn" onclick="document.getElementById('modal-root').innerHTML='';render()">Annuleren</button></div></div></div>`;pictureSelector('edit-pictures')}
let editingPictureStudent=null;
function savePictureCode(){if(!isTeacher()||chosenPictures.length!==4)return;const st=findStudent(editingPictureStudent);if(!st)return;st.pictureCode=chosenPictures.join('-');save();chosenPictures=[];picturePurpose=null;editingPictureStudent=null;render();toast('Plaatjeswachtwoord ingesteld voor '+st.name)}

function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.lists)&&Array.isArray(x.students))return x}catch(e){}return clone(SAMPLE)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Opslaan lukt niet: opslag van deze browser is vol of geblokkeerd.')}}
function id(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s||'').normalize('NFC').trim().toLocaleLowerCase('nl-NL')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(saveTimer);saveTimer=setTimeout(()=>t.classList.add('hidden'),3000)}
function progressKey(s,l){return s+'::'+l}
function getProgress(s,l){return db.progress[progressKey(s,l)]||{round:0,history:{},lastPractice:null}}
function updateProgress(s,l,p){db.progress[progressKey(s,l)]=p;save()}
function mastered(p,l){return l.words.every(w=>(p.history?.[norm(w)]?.clean||0)>=3)}
function percentage(p,l){return l.words.length?Math.round(100*l.words.reduce((sum,w)=>sum+Math.min(3,p.history?.[norm(w)]?.clean||0),0)/(3*l.words.length)):0}
function findStudent(id){return db.students.find(s=>s.id===id)}
function findList(id){return db.lists.find(l=>l.id===id)}
function app(){return document.getElementById('app')}
function header(){return `<header class="top"><div class="brand" role="button" tabindex="0" onclick="navigate('${isTeacher()?'teacher':isStudent()?'student':'home'}')"><span class="brand-mark">✳</span>letterlab<span style="color:#b7c6be">.</span></div><nav class="top-actions">${auth?`<span class="pill">${isTeacher()?'Leerkracht':esc(findStudent(activeStudent)?.name||'Leerling')}</span><button class="chip" onclick="logout()">Uitloggen</button>`:`<button class="chip" onclick="navigate('home')">Start</button>`}</nav></header>`}
function layout(content){app().innerHTML=`<div class="shell">${header()}<main>${content}</main><div class="footer">Letterlab 1.2 proefversie · Accounts en resultaten alleen op deze browser · Geen echte online beveiliging</div></div>`}
function navigate(page,arg){if(session&&['practice','dictation'].includes(view)&&page!=='result'){if(!confirm('Oefening verlaten? De huidige ronde wordt niet tussentijds opgeslagen.'))return}session=null;view=page;if(arg!==undefined)activeStudent=arg;render()}
function render(){document.getElementById('modal-root').innerHTML='';if(!db.teacherAuth){view='setup';setupTeacher();return}if(!accessAllowed()){view=auth?.role==='teacher'?'teacher':auth?.role==='student'?'student':'home'}if(view==='home')home();else if(view==='login-teacher')teacherLoginView();else if(view==='login-student')studentLoginView();else if(view==='teacher')teacher();else if(view==='student')studentHome();else if(view==='edit')editList();else if(view==='reports')reports();else if(view==='practice')renderPractice();else if(view==='dictation')renderDictation();else if(view==='result')renderResult()}
function home(){layout(`<section class="learner-hero"><div><p class="eyebrow">Letterlab</p><h1>Spellen leer je door te doen.</h1><p class="intro">Log in om jouw woorden te oefenen.</p></div><div class="card" style="text-align:center;background:#e7f2e9;border:0"><div class="welcome-illustration">✍️</div><b>Rustig kijken. Goed luisteren. Zelf typen.</b></div></section><div class="grid two"><article class="card"><div class="icon">🎒</div><h2>Ik ben leerling</h2><p>Log in met je naam en vier plaatjes.</p><button class="btn primary big" onclick="navigate('login-student')">Leerling inloggen</button></article><article class="card"><div class="icon">🔑</div><h2>Ik ben leerkracht</h2><p>Beheer de leerlingen en woordenlijsten.</p><button class="btn big" onclick="navigate('login-teacher')">Leerkracht inloggen</button></article></div>`)}

function studentHome(){if(!isStudent())return logout();const s=findStudent(activeStudent);if(!s){view='home';render();return}const lists=db.lists.filter(l=>l.assigned.includes(s.id));layout(`<div class="header"><button class="btn ghost small" onclick="logout()">← Uitloggen</button><p class="eyebrow" style="margin-top:22px">Jouw oefenplek</p><h1>Hoi, ${esc(s.name)}!</h1><p>Welke woorden ga jij vandaag oefenen?</p></div><div class="grid two">${lists.map(l=>{let p=getProgress(s.id,l.id),pct=percentage(p,l),done=mastered(p,l);return `<section class="card"><div class="row between"><span class="pill">${esc(l.level)}</span>${done?'<span class="pill good">✓ Oefendoel bereikt</span>':`<span class="pill">${pct}% geoefend</span>`}</div><h2 style="margin-top:20px">${esc(l.name)}</h2><p>${l.words.length} woorden · ${p.round} oefenrondes afgerond</p><p class="micro" style="color:var(--green);font-weight:700">${motivationalStart(p,l)}</p><div class="bar"><i style="width:${pct}%"></i></div><div class="row wrap" style="margin-top:22px"><button class="btn primary" onclick="startPractice('${esc(l.id)}')">${p.round?'Verder oefenen':'Begin oefenen'} →</button><button class="btn" ${done?'':'disabled title="Oefen eerst ieder woord drie keer zonder hulp"'} onclick="startDictation('${esc(l.id)}')">Einddictee 🔒</button></div>${done?'<p class="micro" style="margin:11px 0 0">Het einddictee is vrijgegeven. Je mag fouten maken; pas achteraf zie je je resultaat.</p>':''}</section>`}).join('')||`<section class="card empty"><h3>Nog geen woordenlijsten</h3><p>Vraag je leerkracht om een lijst voor jou klaar te zetten.</p></section>`}</div>`)}
function teacher(){if(!isTeacher())return logout();let latest=db.results.slice(-4).reverse();layout(`<div class="header"><p class="eyebrow">Beheeromgeving · lokaal beveiligd</p><h1>Leerkracht</h1><p>Maak lijsten, wijs ze toe en bekijk hoe het oefenen verloopt. Beheer de leerlingaccounts en woordenlijsten.</p><button class="btn small" onclick="changeTeacherCredentials()">Mijn gebruikersnaam / wachtwoord wijzigen</button></div><div class="grid" style="margin-bottom:22px"><div class="card"><span class="muted micro">Leerlingen</span><div class="stat">${db.students.length}</div></div><div class="card"><span class="muted micro">Woordenlijsten</span><div class="stat">${db.lists.length}</div></div><div class="card"><span class="muted micro">Einddictees</span><div class="stat">${db.results.length}</div></div></div><section class="card" style="margin-bottom:18px"><div class="panel-title"><h2 style="margin:0">Woordenlijsten</h2><button class="btn primary" onclick="newList()">+ Nieuwe lijst</button></div>${db.lists.map(l=>`<div class="list-row"><div><h3>${esc(l.name)}</h3><p>${esc(l.level)} · ${l.words.length} woorden · ${l.assigned.length} leerlingen</p></div><div class="actions"><button class="btn small" onclick="openEdit('${esc(l.id)}')">Bewerken</button><button class="btn small" onclick="duplicateList('${esc(l.id)}')">Kopieer</button><button class="btn small danger" onclick="deleteList('${esc(l.id)}')">Verwijder</button></div></div>`).join('')||'<p>Nog geen woordenlijsten.</p>'}</section><div class="grid two"><section class="card"><div class="panel-title"><h2 style="margin:0">Leerlingen</h2><button class="btn small" onclick="addStudent()">+ Leerling</button></div>${db.students.map(s=>`<div class="list-row"><div><strong>${esc(s.name)}</strong><p class="micro">${esc(s.username||"Nog geen gebruikersnaam")} · ${s.pictureCode?"4 plaatjes ingesteld":"Plaatjes nog instellen"}</p></div><div class="actions"><button class="btn small" onclick="renameStudent('${esc(s.id)}')">Naam</button><button class="btn small" onclick="editStudentAccount('${esc(s.id)}')">Inlog wijzigen</button><button class="btn small danger" onclick="deleteStudent('${esc(s.id)}')">×</button></div></div>`).join('')}</section><section class="card"><div class="panel-title"><h2 style="margin:0">Laatste dictees</h2><button class="btn small" onclick="navigate('reports')">Alle resultaten</button></div>${latest.length?latest.map(r=>`<div class="list-row"><div><strong>${esc(r.studentName)}</strong><p>${esc(r.listName)} · ${esc(new Date(r.date).toLocaleDateString('nl-NL'))}</p></div><span class="pill ${r.correct===r.total?'good':''}">${r.correct}/${r.total}</span></div>`).join(''):'<p>Er zijn nog geen dictees gemaakt.</p>'}</section></div><section class="card" style="margin-top:18px;margin-bottom:18px"><div class="panel-title"><h2 style="margin:0">🔊 Nederlandse uitspraak</h2><span class="pill">Gratis · zonder abonnement</span></div><p>Letterlab leest nieuwe woordenlijsten automatisch voor met een Nederlandse stem die beschikbaar is op dit apparaat. Kies hieronder de prettigste stem. Zie je alleen Xander en Ellen? Dan zijn dat op dit apparaat de stemmen die Edge op dit moment aan websites beschikbaar stelt; Letterlab kan geen extra systeemstemmen afdwingen.</p><div class="form-grid"><label class="field">Nederlandse stem<select id="voice-choice" onchange="setVoiceChoice(this.value)"><option value="auto">Automatisch beste Nederlandse stem</option></select></label><label class="field">Spreeksnelheid<select id="voice-rate" onchange="setVoiceRate(this.value)"><option value="0.75">Extra rustig</option><option value="0.9">Rustig</option><option value="1">Normaal</option><option value="1.1">Iets sneller</option></select></label></div><div class="row wrap" style="margin-top:16px"><button class="btn primary" onclick="testVoice()">▶ Test de uitspraak</button><button class="btn" onclick="refreshVoices(true)">↻ Stemmen opnieuw zoeken</button></div><div id="voice-status" class="notice" style="margin-top:14px" aria-live="polite">Nederlandse stemmen worden opgezocht… Klik op vernieuwen als er maar twee verschijnen.</div><p class="micro muted" style="margin-top:12px;margin-bottom:0">Let op: de stemkwaliteit hangt af van iPhone, iPad, Mac of computer. Als de browser geen Nederlandse stem heeft, kun je die via de apparaatinstellingen toevoegen. De spraakfunctie vereist een browser die tekst-naar-spraak ondersteunt; in een bestandsvoorvertoning werkt dit soms niet.</p></section><div class="row wrap" style="margin-top:22px"><button class="btn" onclick="exportData()">↓ Reservekopie downloaden</button><button class="btn" onclick="importData()">↑ Reservekopie terugzetten</button><button class="btn danger" onclick="resetAll()">Proefgegevens herstellen</button></div><p class="micro muted" style="margin-top:11px">Gebruik dit zonder echte gevoelige leerlinggegevens. De lokale inlogschermen zijn geen serverbeveiliging en bieden geen centrale opslag.</p>`);setTimeout(()=>refreshVoices(false),0);setTimeout(()=>refreshVoices(false),650);setTimeout(()=>refreshVoices(false),1800)}
function newList(){if(!isTeacher())return;editingId=null;view='edit';render()}

function editList(){if(!isTeacher())return logout();let l=editingId?findList(editingId):null;let checked=l?l.assigned:db.students.map(s=>s.id);layout(`<button class="btn ghost small" onclick="navigate('teacher')">← Terug naar beheer</button><div class="header" style="margin-top:24px"><p class="eyebrow">Woordenlijst</p><h1>${l?'Lijst bewerken':'Nieuwe lijst'}</h1><p>Plak woorden onder elkaar. Het programma oefent ze automatisch één voor één.</p></div><form class="card stack" onsubmit="saveList(event)"><div class="form-grid"><label class="field">Naam van de lijst<input id="list-name" type="text" maxlength="100" required placeholder="Bijvoorbeeld: Staal – week 3" value="${esc(l?.name||'')}"></label><label class="field">Groep / categorie<select id="list-level">${['Groep 3','Groep 4','Groep 5','Groep 6','Overig'].map(level=>`<option ${l?.level===level?'selected':''}>${level}</option>`).join('')}</select></label></div><label class="field">Woorden (één woord per regel)<textarea id="list-words" required spellcheck="false" placeholder="gevaarlijk&#10;heerlijk&#10;eerlijk">${esc(l?.words.join('\n')||'')}</textarea><span class="micro muted">Een woord of korte woordgroep per regel. Dubbele woorden worden verwijderd.</span></label><div class="field">Beschikbaar voor leerlingen<div class="check-list">${db.students.map(s=>`<label><input type="checkbox" class="assignment" value="${esc(s.id)}" ${checked.includes(s.id)?'checked':''}> ${esc(s.name)}</label>`).join('')||'<span class="muted">Maak eerst een leerling aan via Leerkracht.</span>'}</div></div><div class="notice">Bij het aanpassen van de woorden in een bestaande lijst blijft de voortgang van ongewijzigde woorden bewaard. Nieuwe woorden starten op nul.</div><div class="row wrap"><button type="submit" class="btn primary big">Lijst opslaan</button><button class="btn" type="button" onclick="navigate('teacher')">Annuleren</button></div></form>`)}
function saveList(e){if(!isTeacher())return;e.preventDefault();let name=document.getElementById('list-name').value.trim(),level=document.getElementById('list-level').value;let words=document.getElementById('list-words').value.split(/\r?\n/).map(x=>x.trim().replace(/\s+/g,' ')).filter(Boolean);words=[...new Map(words.map(w=>[norm(w),w])).values()];if(!name||!words.length)return toast('Voer een naam en minimaal één woord in.');if(words.length>150)return toast('Maximaal 150 woorden per lijst.');if(words.some(w=>w.length>60))return toast('Een woord mag maximaal 60 tekens bevatten.');let assigned=[...document.querySelectorAll('.assignment:checked')].map(x=>x.value);if(editingId){let l=findList(editingId);if(!l)return;l.name=name;l.level=level;l.words=words;l.assigned=assigned}else db.lists.push({id:'l_'+id(),name,level,words,assigned});save();view='teacher';render();toast('Woordenlijst opgeslagen')}
function duplicateList(i){if(!isTeacher())return;let l=findList(i);if(!l)return;db.lists.push({...clone(l),id:'l_'+id(),name:l.name+' (kopie)'});save();render()}
function deleteList(i){if(!isTeacher())return;let l=findList(i);if(!l||!confirm(`Woordenlijst '${l.name}' verwijderen? Bestaande dicteeresultaten blijven bewaard.`))return;db.lists=db.lists.filter(x=>x.id!==i);for(let k of Object.keys(db.progress)){if(k.endsWith('::'+i))delete db.progress[k]}save();render()}
function addStudent(){if(!isTeacher())return;let name=prompt('Naam of leerlingcode (bijvoorbeeld: Leerling A):');if(name===null)return;name=name.trim().slice(0,50);if(!name)return toast('Vul een naam in.');let username=prompt('Gebruikersnaam voor '+name+' (minimaal 3 tekens):');if(username===null)return;username=username.trim().toLowerCase();if(!usernameValid(username)||studentByUsername(username))return toast('Ongeldige of al gebruikte gebruikersnaam.');const st={id:'s_'+id(),name,username};db.students.push(st);save();render();beginPictureEdit(st.id)}
function renameStudent(i){if(!isTeacher())return;let s=findStudent(i);if(!s)return;let name=prompt('Nieuwe naam of code:',s.name);if(name===null)return;name=name.trim().slice(0,50);if(!name)return;s.name=name;save();render()}
function deleteStudent(i){if(!isTeacher())return;let s=findStudent(i);if(!s||!confirm(`Leerling '${s.name}' verwijderen? De voortgang wordt ook verwijderd.`))return;db.students=db.students.filter(x=>x.id!==i);for(let l of db.lists)l.assigned=l.assigned.filter(a=>a!==i);for(let k of Object.keys(db.progress))if(k.startsWith(i+'::'))delete db.progress[k];save();render()}
function reports(){if(!isTeacher())return logout();layout(`<button class="btn ghost small" onclick="navigate('teacher')">← Beheer</button><div class="header" style="margin-top:25px"><p class="eyebrow">Resultaten</p><h1>Einddictees</h1><p>Een dictee wordt pas nagekeken nadat alle antwoorden zijn ingevoerd.</p></div><section class="card">${db.results.length?db.results.slice().reverse().map(r=>`<div class="list-row"><div><h3>${esc(r.studentName)} · ${esc(r.listName)}</h3><p>${esc(new Date(r.date).toLocaleString('nl-NL'))} · ${r.total} woorden</p><details><summary class="micro" style="cursor:pointer;color:var(--green)">Bekijk antwoorden</summary><div style="margin-top:10px">${r.answers.map(a=>`<div class="micro" style="padding:4px 0">${a.correct?'✓':'✗'} ${esc(a.word)} ${a.correct?'':`→ ${esc(a.typed||'(leeg)')}`}</div>`).join('')}</div></details></div><strong class="pill ${r.correct===r.total?'good':''}">${r.correct}/${r.total}</strong></div>`).join(''):'<p>Nog geen resultaten.</p>'}</section>`)}
function exportData(){if(!isTeacher())return;let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='letterlab-reservekopie-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(){if(!isTeacher())return;let inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=async()=>{try{let x=JSON.parse(await inp.files[0].text());if(!Array.isArray(x.students)||!Array.isArray(x.lists)||!Array.isArray(x.results)||typeof x.progress!=='object')throw Error('Ongeldig bestand');if(!confirm('De huidige gegevens vervangen door deze reservekopie?'))return;x.teacherAuth=db.teacherAuth;db=x;save();render();toast('Reservekopie teruggezet; je huidige leerkrachtaccount blijft behouden')}catch(e){toast('Dit lijkt geen geldige Letterlab-reservekopie.')}};inp.click()}
function resetAll(){if(!isTeacher())return;if(!confirm('Alle huidige lijsten, leerlingen en resultaten wissen en de proefgegevens herstellen?'))return;let oldTeacher=db.teacherAuth;db=clone(SAMPLE);db.teacherAuth=oldTeacher;save();view='teacher';render();toast('Proefgegevens hersteld')}
function voiceId(v){return v.voiceURI+'||'+v.lang+'||'+v.name}
function dutchVoices(){if(!('speechSynthesis' in window))return [];return speechSynthesis.getVoices().filter(v=>/^nl(?:-|$)/i.test(v.lang))}
function rankVoice(v){let name=(v.name||'').toLowerCase();return (v.localService?1:0)+(name.includes('enhanced')||name.includes('premium')||name.includes('siri')?5:0)+(v.lang.toLowerCase()==='nl-nl'?2:0)}
function preferredVoice(){let voices=dutchVoices();let selected=voices.find(v=>voiceId(v)===voicePrefs.id);return selected||voices.slice().sort((a,b)=>rankVoice(b)-rankVoice(a))[0]||null}
function refreshVoices(notify){let sel=document.getElementById('voice-choice'),status=document.getElementById('voice-status');if(!sel||!status)return;let vs=dutchVoices();sel.innerHTML='<option value="auto">Automatisch beste Nederlandse stem</option>'+vs.map(v=>'<option value="'+esc(voiceId(v))+'">'+esc(v.name)+' ('+esc(v.lang)+')'+(v.localService?' · op apparaat':' · via browser')+'</option>').join('');sel.value=vs.some(v=>voiceId(v)===voicePrefs.id)?voicePrefs.id:'auto';let rate=document.getElementById('voice-rate');if(rate)rate.value=String(voicePrefs.rate);status.textContent=!('speechSynthesis' in window)?'Deze browser ondersteunt geen tekst-naar-spraak. Open Letterlab in Safari, Chrome of Edge.':vs.length?'Beschikbaar: '+vs.length+' Nederlandse '+(vs.length===1?'stem':'stemmen')+'. Gekozen: '+(preferredVoice()?.name||'automatisch')+'. Druk op Test de uitspraak om geluid te horen.':'Er wordt nog geen Nederlandse stem gevonden. Controleer de Nederlandse spraakstemmen in de instellingen van het apparaat en druk op Stemmen vernieuwen.';if(notify&&!vs.length)toast('Geen Nederlandse stem gevonden op dit apparaat.')}
function saveVoicePrefs(){try{localStorage.setItem(VOICE_KEY,JSON.stringify(voicePrefs))}catch(e){}}
function setVoiceChoice(value){voicePrefs.id=value;saveVoicePrefs();refreshVoices(false)}
function setVoiceRate(value){voicePrefs.rate=Number(value)||0.9;saveVoicePrefs();refreshVoices(false)}
function testVoice(){speak('gevaarlijk');let status=document.getElementById('voice-status');if(status&&preferredVoice())status.textContent='Test: gevaarlijk · stem: '+preferredVoice().name+'. Hoor je niets? Open de website rechtstreeks in Safari of Chrome (niet in een voorvertoning) en controleer het mediavolume.'}
// Firefox can produce a sharp click when speechSynthesis.cancel() interrupts a voice.
// Never cancel on each word. Wait for the current utterance to finish and play only
// the most recently requested word, avoiding overlapping or abruptly cut audio.
function speak(t){
 if(!('speechSynthesis' in window)){toast('Deze browser ondersteunt geen voorlezen.');return}
 const nl=preferredVoice();
 if(!nl){toast('Geen Nederlandse stem gevonden; controleer de steminstellingen.');return}
 if(currentUtterance){
   if(currentUtterance.text===t && !pendingSpeech)return;
   pendingSpeech=t;
   return;
 }
 playSpeech(t,nl);
}
function playSpeech(t,nl){
 try{
   clearTimeout(voiceEndTimer);
   const u=new SpeechSynthesisUtterance(t);
   u.lang='nl-NL';u.rate=voicePrefs.rate;u.pitch=1;u.volume=0.85;u.voice=nl;
   currentUtterance=u;
   const finish=()=>{
     if(currentUtterance!==u)return;
     currentUtterance=null;
     const next=pendingSpeech;pendingSpeech=null;
     if(next!==null)voiceEndTimer=setTimeout(()=>{if(!currentUtterance)playSpeech(next,preferredVoice()||nl);else pendingSpeech=next},180);
   };
   u.onend=finish;
   u.onerror=(ev)=>{
     if(ev.error!=='interrupted'&&ev.error!=='canceled')toast('Voorlezen mislukt. Probeer Edge of Chrome.');
     finish();
   };
   speechSynthesis.speak(u);
 }catch(e){currentUtterance=null;toast('Voorlezen is hier niet beschikbaar.')}
}
if('speechSynthesis' in window){speechSynthesis.addEventListener?.('voiceschanged',()=>refreshVoices(false));}
function speakCurrent(){if(session?.words&&session.index<session.words.length)speak(session.words[session.index])}
function encouragement(clean,at){
 const cleanPhrases=['Sterk! Helemaal zelfstandig.','Knap onthouden!','Precies goed!','Je concentratie betaalt zich uit.','Goed gekeken én goed geschreven!'];
 const growthPhrases=['Je hebt doorgezet. Dat telt!','Goed dat je verder probeert.','Stap voor stap kom je vooruit.','Door te oefenen leer je dit woord.'];
 const phrases=clean?cleanPhrases:growthPhrases;
 return phrases[at%phrases.length];
}
function sessionMilestones(clean){
 return `<div class="milestones" aria-label="Oefenmijlpalen">${[2,5,10].map(n=>`<span class="milestone ${clean>=n?'earned':''}">${clean>=n?'★':'☆'} ${n} zelfstandig</span>`).join('')}</div>`;
}
function motivationalStart(p,l){let pct=percentage(p,l);return pct===0?'Vandaag zet je de eerste stap. Je kunt dit!':pct>=80?'Je bent dicht bij je oefendoel. Nog even doorzetten!':pct>=40?'Je bent al flink op weg. Pak je volgende woord!':'Elke goede poging brengt je verder.'}
function startPractice(lid){if(!isStudent())return;const l=findList(lid),s=findStudent(activeStudent);if(!l||!s)return;let p=getProgress(s.id,l.id);let remaining=l.words.filter(w=>(p.history[norm(w)]?.clean||0)<3);if(!remaining.length){toast('Alle woorden zijn klaar voor het einddictee.');return}let order=remaining.slice();for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}session={type:'practice',lid,sid:s.id,words:order,index:0,phase:'look',mistakes:0,hints:0,trials:[],streak:0,shownSince:Date.now()};view='practice';renderPractice();speak(order[0])}
function exerciseShell(inner,mode){let l=findList(session.lid),s=findStudent(session.sid),max=session.words.length,i=session.index;layout(`<div class="exercise"><div class="exercise-head"><button class="btn small ghost" onclick="exitExercise()">← Stoppen</button><span class="pill">${esc(s.name)} · ${esc(mode)}</span></div><div class="row between" style="margin-bottom:9px"><b>${esc(l.name)}</b><span class="progress-label">Woord ${i+1} van ${max}</span></div><div class="bar" style="margin-bottom:22px"><i style="width:${i/max*100}%"></i></div><section class="card">${inner}</section></div>`)}
function exitExercise(){navigate('student')}
function renderPractice(){if(!session||session.type!=='practice')return;let w=session.words[session.index];if(!w)return finishPractice();if(session.phase==='look'){exerciseShell(`<p class="eyebrow">Stap 1 · Kijk en luister</p><p class="instruction">Onthoud hoe je dit schrijft</p><div class="word-stage"><div class="word-display">${esc(w)}</div><button class="listen" onclick="speakCurrent()" aria-label="Luister opnieuw">🔊</button></div><p class="hint">Kijk rustig naar alle letters. Spreek het woord in je hoofd uit.</p><div class="motivation"><strong>${session.index===0?'Jij gaat ervoor!':'Klaar voor het volgende woord?'}</strong><small>Je leert door aandachtig te oefenen, niet door te haasten.</small></div><button class="btn primary big" onclick="hideWord()" style="margin-top:19px">Ik heb goed gekeken →</button>`,'Oefenen')}
else if(session.phase==='type'){exerciseShell(`<p class="eyebrow">Stap 2 · Schrijf het woord</p><p class="instruction">Wat hoorde je?</p><div class="word-stage"><button class="listen" onclick="speakCurrent()" aria-label="Luister naar het woord">🔊</button><label for="practice-input" class="micro muted" style="margin-top:15px">Typ het woord hieronder</label><input id="practice-input" class="typing" type="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" inputmode="text" aria-label="Typ het gehoorde woord" oninput="practiceInput(this)" onkeydown="practiceKey(event)"><div class="helper"><p class="hint" id="practice-hint">Een verkeerde letter wordt tegengehouden.</p></div></div><div class="row wrap" style="justify-content:center"><button class="btn" onclick="showHint()">💡 Laat het woord even zien</button><button class="btn ghost" onclick="speakCurrent()">🔁 Nog eens luisteren</button></div>`,'Oefenen');document.getElementById('practice-input')?.focus()}
else if(session.phase==='done'){exerciseShell(`<p class="eyebrow">Goed gedaan</p><div class="word-stage"><div class="word-display correct" style="margin:16px">✓ ${esc(w)}</div><p>${encouragement(session.mistakes===0&&session.hints===0,session.index)}</p></div><div class="motivation"><strong>${session.mistakes===0&&session.hints===0?'⭐ Zelfstandig gelukt!':'💪 Doorzetten is ook leren!'}</strong><small>${session.mistakes===0&&session.hints===0?'Dit woord telt mee voor jouw oefendoel.':'Dit woord komt later terug zodat je het sterker onthoudt.'}</small></div>${sessionMilestones(session.trials.filter(t=>t.clean).length+(session.mistakes===0&&session.hints===0?1:0))}<button class="btn primary big" onclick="nextPractice()">${session.index+1===session.words.length?'Ronde afronden':'Volgende woord →'}</button>`,'Oefenen')}
}
function hideWord(){session.phase='type';session.mistakes=0;session.hints=0;renderPractice()}
function practiceKey(e){if(e.key==='Enter')e.preventDefault()}
function practiceInput(el){if(!session||session.phase!=='type')return;let w=session.words[session.index];let val=el.value.normalize('NFC');const expected=w.toLocaleLowerCase('nl-NL');let ok='';for(let ch of [...val]){let candidate=ok+ch;if(expected.startsWith(candidate.toLocaleLowerCase('nl-NL')))ok=candidate;else session.mistakes++}if(el.value!==ok){el.value=ok;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');let msg=document.getElementById('practice-hint');if(msg)msg.textContent='Die letter past nog niet. Probeer een andere.'}if(norm(ok)===norm(w)){session.phase='done';renderPractice()}}
function showHint(){if(!session||session.phase!=='type')return;session.hints++;let w=session.words[session.index];let el=document.getElementById('practice-hint');if(el){el.innerHTML=`Kijk nog eens: <strong style="color:var(--green)">${esc(w)}</strong>`;setTimeout(()=>{if(session&&session.phase==='type'&&document.getElementById('practice-hint')===el)el.textContent='Nu zelf verder typen.'},2500)}}
function nextPractice(){let w=session.words[session.index];session.trials.push({word:w,mistakes:session.mistakes,hints:session.hints,clean:session.mistakes===0&&session.hints===0});session.index++;if(session.index>=session.words.length)return finishPractice();session.phase='look';session.mistakes=0;session.hints=0;renderPractice();speak(session.words[session.index])}
function finishPractice(){if(!isStudent())return;let p=getProgress(session.sid,session.lid);for(let t of session.trials){let k=norm(t.word),h=p.history[k]||{clean:0,attempts:0,mistakes:0,hints:0};h.attempts++;h.mistakes+=t.mistakes;h.hints+=t.hints;if(t.clean)h.clean=Math.min(3,h.clean+1);else h.clean=0;p.history[k]=h}p.round++;p.lastPractice=new Date().toISOString();updateProgress(session.sid,session.lid,p);let l=findList(session.lid),done=mastered(p,l),good=session.trials.filter(t=>t.clean).length;let sid=session.sid,roundSize=session.trials.length;session=null;view='result';session={type:'practice-result',lid:l.id,sid,good,roundSize,done,pct:percentage(p,l)};renderResult()}
function startDictation(lid){if(!isStudent())return;let l=findList(lid),s=findStudent(activeStudent);if(!l||!s)return;if(!mastered(getProgress(s.id,l.id),l)){toast('Oefen eerst ieder woord drie keer zelfstandig goed.');return}let order=l.words.slice();for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}session={type:'dictation',sid:s.id,lid,words:order,index:0,answers:[]};view='dictation';renderDictation();speak(order[0])}
function renderDictation(){if(!session||session.type!=='dictation')return;let w=session.words[session.index];exerciseShell(`<p class="eyebrow">Einddictee · Zonder hulp</p><p class="instruction">Luister en typ het woord</p><p class="micro muted">Fouten mogen nu: we kijken pas na afloop na.</p><div class="word-stage"><button class="listen" onclick="speakCurrent()" aria-label="Luister naar het woord">🔊</button><label for="dict-input" class="micro muted" style="margin-top:16px">Jouw antwoord</label><input id="dict-input" class="typing" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Typ je antwoord" onkeydown="if(event.key==='Enter'){event.preventDefault();dictNext()}"></div><div class="row wrap" style="justify-content:center"><button class="btn primary big" onclick="dictNext()">${session.index+1>=session.words.length?'Dictee nakijken':'Volgende woord →'}</button><button class="btn" onclick="speakCurrent()">🔁 Luister opnieuw</button></div>`,'Einddictee');document.getElementById('dict-input')?.focus()}
function dictNext(){if(!session||session.type!=='dictation')return;let val=document.getElementById('dict-input')?.value.trim()||'';if(!val&&!confirm('Je hebt nog niets ingevuld. Toch verdergaan?'))return;session.answers.push({word:session.words[session.index],typed:val,correct:norm(val)===norm(session.words[session.index])});session.index++;if(session.index>=session.words.length)return finishDict();renderDictation();speak(session.words[session.index])}
function finishDict(){if(!isStudent())return;let s=findStudent(session.sid),l=findList(session.lid),answers=session.answers,correct=answers.filter(a=>a.correct).length;let r={id:'r_'+id(),studentId:s.id,studentName:s.name,listId:l.id,listName:l.name,date:new Date().toISOString(),total:answers.length,correct,answers};db.results.push(r);if(db.results.length>500)db.results=db.results.slice(-500);if(correct<answers.length){let p=getProgress(s.id,l.id);for(let a of answers.filter(a=>!a.correct)){let k=norm(a.word),h=p.history[k]||{clean:0,attempts:0,mistakes:0,hints:0};h.clean=0;p.history[k]=h}updateProgress(s.id,l.id,p)}save();session={type:'dict-result',lid:l.id,sid:s.id,result:r};view='result';renderResult()}
function renderResult(){if(!session)return navigate('student');if(session.type==='practice-result'){let x=session;layout(`<div class="exercise"><p class="eyebrow">Oefenronde afgerond</p><h1>${x.done?'Doel bereikt! 🏆':'Goed gewerkt! 🌟'}</h1><div class="card"><div class="motivation"><strong>${x.done?'Je hebt alle oefendoelen gehaald!':x.good===x.roundSize?'Alle woorden in deze ronde zelfstandig goed!':'Je bent sterker geworden door te oefenen.'}</strong><small>${x.done?'Je hebt het einddictee verdiend.':'De woorden die nog aandacht vragen, krijg je opnieuw. Dat is slim oefenen.'}</small></div><div class="result-number">${x.good}</div><p>van de ${x.roundSize} woorden deze ronde zelfstandig en zonder verkeerde letter getypt. </p><div class="divider"></div><h3>${x.pct}% van de oefendoelen behaald</h3><div class="bar"><i style="width:${x.pct}%"></i></div><p style="margin-top:15px">${x.done?'Alle woorden zijn drie keer foutloos en zonder hulp getypt. Je einddictee is vrijgegeven!':'Woorden die nog moeilijk zijn, komen opnieuw terug. Je mag de ronde zo vaak oefenen als je wilt.'}</p><div class="row wrap" style="justify-content:center"><button class="btn primary" onclick="openStudent('${esc(x.sid)}')">Naar mijn lijsten</button>${x.done?`<button class="btn" onclick="startDictation('${esc(x.lid)}')">Begin einddictee</button>`:`<button class="btn" onclick="activeStudent='${esc(x.sid)}';startPractice('${esc(x.lid)}')">Nog een ronde</button>`}</div></div></div>`);return}
if(session.type==='dict-result'){let r=session.result;layout(`<div class="exercise"><p class="eyebrow">Dictee afgerond</p><h1>Dit is je resultaat</h1><section class="card"><div class="result-number">${r.correct}<span style="font-size:35px;color:var(--muted)"> / ${r.total}</span></div><p>${r.correct===r.total?'Fantastisch! Alle woorden goed geschreven! 🏆':r.correct>=Math.ceil(r.total*.8)?'Sterk resultaat! Je bent dicht bij je doel. 🌟':'Je hebt geoefend en ontdekt welke woorden nog aandacht verdienen. Goed doorgezet! 💪'}</p><div class="divider"></div><div style="text-align:left">${r.answers.map(a=>`<div class="mini-result"><div><strong>${esc(a.word)}</strong>${a.correct?'':`<div class="micro muted">Jouw antwoord: ${esc(a.typed||'(leeg)')}</div>`}</div><strong class="${a.correct?'correct':'incorrect'}">${a.correct?'✓ Goed':'✗ Oefenen'}</strong></div>`).join('')}</div><div class="row wrap" style="justify-content:center;margin-top:25px"><button class="btn primary" onclick="openStudent('${esc(session.sid)}')">Terug naar mijn lijsten</button>${r.correct!==r.total?`<button class="btn" onclick="startPractice('${esc(r.listId)}')">Moeilijke woorden oefenen</button>`:''}</div></section></div>`)}
}
render();
</script>
</body>
</html>
